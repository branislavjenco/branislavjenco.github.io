<html>
    <head>
        <title>Branislav Jenco</title>
        <style>
            .container {
                margin: 0 auto;
                max-width: 500px;
                line-height: 1.3;
            }

            code {
                background-color: rgb(244, 244, 244);
                border: 1px solid rgb(194, 194, 194);
                border-radius: 5px;
                padding: 2px;
            }
        </style>
        <script
            data-goatcounter="https://branislavjenco.goatcounter.com/count"
            async
            src="//gc.zgo.at/count.js"
        ></script>
        <script type="text/javascript">
            document.addEventListener(
                "DOMContentLoaded",
                function () {
                    function stripcdata(x) {
                        if (x.startsWith("% <![CDATA[") && x.endsWith("%]]>"))
                            return x.substring(11, x.length - 4);
                        return x;
                    }
                    document
                        .querySelectorAll("script[type='math/tex']")
                        .forEach(function (el) {
                            el.outerHTML =
                                "\\(" + stripcdata(el.textContent) + "\\)";
                        });
                    document
                        .querySelectorAll(
                            "script[type='math/tex; mode=display']"
                        )
                        .forEach(function (el) {
                            el.outerHTML =
                                "\\[" + stripcdata(el.textContent) + "\\]";
                        });
                    var script = document.createElement("script");
                    script.src =
                        "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js";
                    document.head.appendChild(script);
                },
                false
            );
        </script>
    </head>
    <body>
        <div class="container">
            <div>{{ about|safe }}</div>
            <div>
                <h1>Posts</h1>
                {{ posts|safe }}
            </div>
        </div>
    </body>
</html>
