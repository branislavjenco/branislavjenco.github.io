<html>
    <head>
        <title>Branislav Jenco</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,200..900;1,8..60,200..900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="styles/style.css" />
        <script
            data-goatcounter="https://branislavjenco.goatcounter.com/count"
            async
            src="//gc.zgo.at/count.js"
        ></script>
        <script>
            MathJax = {
                tex: {
                    inlineMath: [
                        ["$", "$"],
                        ["\\(", "\\)"],
                    ],
                },
            };
        </script>
        <script
            id="MathJax-script"
            async
            src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
        ></script>
    </head>
    <body>
        <div class="container">
            <header class="row">
                <h1 class="title"><a href=".">branislav jenco</a></h1>
                <span class="row">
                    <a href="." style="margin-right: 1rem"
                        ><h2>&#x2196; other posts</h2></a
                    >
                    <a href="./about.html"><h2>about</h2></a>
                </span>
            </header>
            <hr>
            <main class="post">
                <h1 a>{{ title|safe }}</h1>
                <p>
                    <em class="date">{{ date|safe }}</em>
                </p>
                {{ body|safe }}
            </main>
            {{ footer|safe }}
        </div>
    </body>
</html>
